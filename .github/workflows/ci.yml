name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: ninjasec_migrations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ninjasec_migrations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PY-MK/backend/requirements.txt

      - name: Instalar dependencias
        working-directory: PY-MK/backend
        run: python -m pip install --requirement requirements.txt

      - name: Ejecutar pruebas
        working-directory: PY-MK/backend
        env:
          PYTHONPATH: .
          ALEMBIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-only@localhost:5432/ninjasec_migrations_test
        run: JWT_SECRET_KEY="$(openssl rand -hex 32)" pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PY-MK/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: PY-MK/frontend
        run: npm ci

      - name: Auditar vulnerabilidades criticas
        working-directory: PY-MK/frontend
        run: npm audit --audit-level=critical

      - name: Compilar frontend
        working-directory: PY-MK/frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    # A nivel de job, no de paso: `docker compose down -v` del paso de limpieza
    # tambien necesita interpolar POSTGRES_PASSWORD, y sin ellas fallaba con
    # "required variable POSTGRES_PASSWORD is missing a value" DESPUES de que
    # las pruebas ya hubieran corrido. El job salia rojo por la limpieza.
    env:
      POSTGRES_PASSWORD: ci-solo-para-pruebas
      JWT_SECRET_KEY: ci-solo-para-pruebas-no-es-un-secreto-real
      SEED_ON_STARTUP: "true"
      IS_PRODUCTION: "false"
    # Solo tiene sentido levantar el stack si el codigo compila y los tests
    # unitarios pasan. Sin esta puerta se gastarian ~5 minutos de runner
    # construyendo imagenes de codigo que ya se sabe roto.
    needs: [backend-tests, frontend-build]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/package-lock.json

      # El unico sitio del CI donde se construye lo que de verdad se entrega.
      # El producto se despliega con Docker Compose; hasta ahora nada
      # verificaba que esas imagenes siquiera compilaran.
      - name: Levantar el stack con Docker Compose
        working-directory: PY-MK/infra
        run: docker compose up -d --build

      - name: Esperar a que el stack responda
        run: |
          echo "Esperando al backend..."
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8024/health >/dev/null 2>&1; then
              echo "Backend arriba tras $i intentos"; break
            fi
            if [ "$i" = "40" ]; then echo "::error::El backend nunca respondio"; exit 1; fi
            sleep 3
          done
          echo "Esperando al frontend..."
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3018 >/dev/null 2>&1; then
              echo "Frontend arriba tras $i intentos"; break
            fi
            if [ "$i" = "40" ]; then echo "::error::El frontend nunca respondio"; exit 1; fi
            sleep 3
          done

      - name: Instalar Playwright
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: qa
        env:
          NINJASEC_BASE_URL: http://localhost:3018
        run: npm test

      # Sin esto, un fallo en CI es un mensaje sin contexto. Con esto se ve
      # que pasaba dentro de los contenedores en el momento exacto.
      - name: Logs de los contenedores si algo fallo
        if: failure()
        working-directory: PY-MK/infra
        run: docker compose logs --tail=200

      - name: Guardar el informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 7

      - name: Limpiar
        if: always()
        working-directory: PY-MK/infra
        run: docker compose down -v

  contrato-api:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    # Solo en PR: compara contra la rama destino. En un push a main no hay
    # con que comparar.
    if: github.event_name == 'pull_request'
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PY-MK/backend/requirements.txt

      - name: Instalar dependencias
        working-directory: PY-MK/backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # El esquema se genera importando la app, no levantando el servidor:
      # app.openapi() no necesita base de datos ni red. Segundos, no minutos.
      - name: Exportar el contrato de esta rama
        working-directory: PY-MK/backend
        env:
          PYTHONPATH: .
        run: python scripts/exportar_openapi.py "$RUNNER_TEMP/openapi-pr.json"

      - name: Exportar el contrato de la rama destino
        working-directory: PY-MK/backend
        env:
          PYTHONPATH: .
        run: |
          git stash --include-untracked || true
          git checkout --quiet "origin/${{ github.base_ref }}"
          # Si el script aun no existe en la rama destino, no hay contrato
          # anterior con el que comparar: es la primera vez que corre.
          if [ -f scripts/exportar_openapi.py ]; then
            python scripts/exportar_openapi.py "$RUNNER_TEMP/openapi-base.json"
          else
            echo "SIN_BASE=1" >> "$GITHUB_ENV"
            echo "::notice::La rama destino aun no exporta el contrato; nada que comparar."
          fi
          git checkout --quiet -
          git stash pop || true

      - name: Comparar y fallar solo ante cambios que ROMPEN
        if: env.SIN_BASE != '1'
        run: |
          # oasdiff clasifica: ERR rompe a quien consume, WARN no.
          # Solo ERR pone el PR en rojo -- añadir un endpoint o un campo
          # opcional es seguro y no debe bloquear nada.
          docker run --rm \
            -v "$RUNNER_TEMP:/specs" \
            tufin/oasdiff:latest \
            breaking /specs/openapi-base.json /specs/openapi-pr.json \
            --fail-on ERR

      - name: Resumen del cambio de contrato
        if: ${{ !cancelled() && env.SIN_BASE != '1' }}
        run: |
          {
            echo "### Cambios en el contrato de la API"
            echo ""
            echo '```'
            docker run --rm -v "$RUNNER_TEMP:/specs" tufin/oasdiff:latest \
              changelog /specs/openapi-base.json /specs/openapi-pr.json 2>&1 | head -60 || true
            echo '```'
            echo ""
            echo "_29 archivos de \`frontend/src/lib/api/\` consumen este contrato._"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security
    uses: ./.github/workflows/security.yml
