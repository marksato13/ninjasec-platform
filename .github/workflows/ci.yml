name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: ninjasec_migrations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ninjasec_migrations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PY-MK/backend/requirements.txt

      - name: Instalar dependencias
        working-directory: PY-MK/backend
        run: python -m pip install --requirement requirements.txt

      - name: Ejecutar pruebas
        working-directory: PY-MK/backend
        env:
          PYTHONPATH: .
          ALEMBIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-only@localhost:5432/ninjasec_migrations_test
        run: JWT_SECRET_KEY="$(openssl rand -hex 32)" pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PY-MK/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: PY-MK/frontend
        run: npm ci

      - name: Auditar vulnerabilidades criticas
        working-directory: PY-MK/frontend
        run: npm audit --audit-level=critical

      - name: Compilar frontend
        working-directory: PY-MK/frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  security:
    name: Security
    uses: ./.github/workflows/security.yml
