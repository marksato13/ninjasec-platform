# ════════════════════════════════════════════════════════════════════
# NinjaSec — Stack de PRODUCCIÓN
# ════════════════════════════════════════════════════════════════════
# Uso (en el servidor VLAN20 DMZ):
#   cp .env.example .env  # editar valores reales
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Notas:
# - Postgres debería correr en otro server (VLAN30) para ISO 27001.
#   Si lo dejás aquí, cambiá POSTGRES_HOST=postgres en .env.
# - Caddy maneja HTTPS automático con Let's Encrypt (necesita DOMAIN).
# - Solo 80/443 expuestos al host. Backend y frontend solo en red interna.
# ════════════════════════════════════════════════════════════════════

services:
  # ─── Reverse proxy con HTTPS automático ────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ninjasec-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN:     ${DOMAIN:?DOMAIN requerido}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - ninjasec-net

  # ─── PostgreSQL (opcional aquí; ideal en VLAN30 DC) ────────────────
  # Comentar este bloque si Postgres corre en otro server.
  postgres:
    image: postgres:16-alpine
    container_name: ninjasec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Backups locales (montar volumen del host para retención)
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ninjasec-net
    # Solo bind a localhost del host por seguridad (no DMZ-public)
    ports:
      - "127.0.0.1:5432:5432"

  # ─── Respaldos de PostgreSQL ───────────────────────────────────────
  # Hasta ahora ./backups era un punto de montaje vacio: estaba declarado y
  # no habia nada que escribiera dentro. Esto es lo que escribe.
  #
  # Contenedor propio y no cron del anfitrion: viaja con el compose y
  # funciona igual en cualquier maquina, sin que nadie tenga que acordarse
  # de configurar nada en el servidor.
  respaldos:
    image: postgres:16-alpine
    container_name: ninjasec-respaldos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST:            postgres
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      RESPALDO_DESTINO:         /respaldos
      RESPALDO_RETENCION_DIAS:  ${RESPALDO_RETENCION_DIAS:-14}
      RESPALDO_INTERVALO_HORAS: ${RESPALDO_INTERVALO_HORAS:-24}
    volumes:
      - ./respaldos/respaldar.sh:/respaldar.sh:ro
      - ./backups:/respaldos
    entrypoint: ["sh", "/respaldar.sh"]
    networks:
      - ninjasec-net

  # ─── Backend FastAPI ───────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ninjasec-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME:                    ${APP_NAME:-Ninja Tech}
      APP_VERSION:                 ${APP_VERSION:-0.2.0}
      API_PREFIX:                  ${API_PREFIX:-/api/v1}
      DATABASE_URL:                postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      JWT_SECRET_KEY:              ${JWT_SECRET_KEY:?required}
      JWT_ALGORITHM:               ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS:                "${CORS_ORIGINS:?CORS_ORIGINS requerido en .env, p.ej. https://tudominio.com}"
      SEED_ON_STARTUP:             "false"
      # Sin esta variable, seed.py SE NIEGA a sembrar en produccion: las
      # claves de desarrollo estan escritas en el codigo y el repositorio
      # va a ser publico. Solo hace falta si de verdad quieres poblar este
      # entorno; en una instalacion normal se deja vacia.
      SEED_PASSWORD:               ${SEED_PASSWORD:-}
      # Login con Google: client_id de una app OAuth (no es secreto). Vacio = sin
      # boton de Google; el login con correo y contrasena sigue igual.
      GOOGLE_CLIENT_ID:            ${GOOGLE_CLIENT_ID:-}
      # Capsulas encendidas. Vacio = ninguna. "telemetria" esta apagada
      # porque los conectores son simulados.
      CAPSULAS_ACTIVAS:            ${CAPSULAS_ACTIVAS:-}
      # IS_PRODUCTION y APP_ENV son equivalentes: cualquiera de las dos
      # enciende settings.is_production (ver app/core/config.py).
      IS_PRODUCTION:               "true"
      APP_ENV:                     production
      STORAGE_PATH:                /data/uploads
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8024/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ninjasec-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Frontend Next.js ──────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: ninjasec-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV:             production
      BACKEND_INTERNAL_URL: http://backend:8024
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3018/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ninjasec-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  ninjasec-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
